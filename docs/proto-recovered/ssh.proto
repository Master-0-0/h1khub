syntax = "proto3";
package proto_model;
option go_package = ".;proto_model";

message FilesResponse {
  repeated File files = 1;
}

message File {
  string name = 1;
  bool isDir = 2;
  bool isLink = 3;
  int64 updatedTime = 4;
  int64 size = 5;
  string mode = 6;
  string user = 7;
  string group = 8;
  string target = 9;
  string url = 10;
}
